<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Love Galaxy</title>

<link rel="preload" href="https://fonts.gstatic.com/s/poppins/v20/pxiByp8kv8JHgFVrLDz8Z1xlFQ.woff2" as="font" type="font/woff2" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Poppins',sans-serif;}
#intro{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:url('assets/background.jpg') no-repeat center center/cover;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;
}
#heartBtn{width:200px;height:200px;cursor:pointer;margin-bottom:20px;}
#loadingBar{
  width:50%;height:20px;background:#ffc0e0;border-radius:10px;
  overflow:hidden;opacity:0;box-shadow:0 2px 6px rgba(255,115,185,0.5);
}
#loadingFill{
  width:0%;height:100%;background:#FF69B4;
  box-shadow:0 0 12px #ff95ca,0 0 20px #FF1493;border-radius:10px;
}
#flash{position:fixed;top:0;left:0;width:100%;height:100%;background:white;opacity:0;pointer-events:none;transition:opacity .6s ease-out;}
#container{width:100%;height:100vh;position:absolute;top:0;left:0;display:none;}
</style>
</head>
<body>

<div id="intro">
  <div id="heartBtn"></div>
  <div id="loadingBar"><div id="loadingFill"></div></div>
</div>
<div id="flash"></div>
<div id="container"></div>
<audio id="bgMusic" loop preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ================================================================
//  CẤU HÌNH — chỉ thay 2 dòng này 1 lần duy nhất
// ================================================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_qBYMyADdF3hnjgstZhKtQLESka1KtAqBYLAtaqDqOsuV47_T7IelX52Uye1I7WSgzTvOtvtINmWP/pub?output=csv";
// Ví dụ: "https://docs.google.com/spreadsheets/d/SHEET_ID/pub?output=csv"

const DRIVE_API_KEY = "AIzaSyARfCFEnAPYnXzb9AIjiD53jgn0ZyL_80Y";
// Ví dụ: "AIzaSyAbCdEfGhIjKlMnOpQrStUvWxYz..."
// ================================================================

// Fallback khi không có ?id= hoặc lỗi load
const DEFAULT_CONFIG = {
  texts: ["Happy Valentine 2026","Thanks u coming","Love u","05.10.2025","𓇼","𓆝","⋆","˚"],
  imageUrls: [], // không dùng ảnh fallback
  musicUrl: "assets/music.mp3",
};

// ================================================================
//  CONFIG LOADER
// ================================================================
let CONFIG = null;
const _cfgQueue = [];

function onConfigReady(cb) {
  if (CONFIG) cb(CONFIG);
  else _cfgQueue.push(cb);
}

async function loadConfig() {
  const id = new URLSearchParams(window.location.search).get('id');

  if (!id || !SHEET_CSV_URL.startsWith('http')) {
    applyConfig(DEFAULT_CONFIG);
    return;
  }

  try {
    // 1. Fetch Google Sheet CSV (published to web)
    const res  = await fetch(SHEET_CSV_URL);
    const csv  = await res.text();
    const rows = parseCSV(csv);
    const row  = rows.find(r => r.id === id);
    if (!row) throw new Error(`ID "${id}" not found in sheet`);

    // 2. Texts — pipe-separated, số lượng tuỳ ý
    const texts = row.texts
      ? row.texts.split('|').map(s => s.trim()).filter(Boolean)
      : DEFAULT_CONFIG.texts;

    // 3. Images — từ Drive folder, lấy hết ảnh bên trong
    let imageUrls = DEFAULT_CONFIG.imageUrls;
    if (row.drive_folder_id && DRIVE_API_KEY) {
      const fileIds = await getDriveFolderImageIds(row.drive_folder_id.trim());
      if (fileIds.length > 0)
        imageUrls = fileIds.map(fid => `https://lh3.googleusercontent.com/d/${fid}=w800`);
    }

    // 4. Music (Drive file ID hoặc URL trực tiếp)
    const musicUrl = row.music_file_id
      ? buildDriveFileUrl(row.music_file_id.trim())
      : DEFAULT_CONFIG.musicUrl;

    // 5. Background
    applyConfig({ texts, imageUrls, musicUrl });

  } catch (e) {
    console.warn('[Config] Fallback to default:', e.message);
    applyConfig(DEFAULT_CONFIG);
  }
}

function applyConfig(cfg) {
  CONFIG = cfg;
  // Set nguồn nhạc
  const audioEl = document.getElementById('bgMusic');
  audioEl.src = cfg.musicUrl;
  audioEl.load();
  console.log('[Music] src:', cfg.musicUrl);
  // Thông báo cho các hàm đang chờ
  _cfgQueue.forEach(cb => cb(cfg));
  _cfgQueue.length = 0;
}

// Gọi Drive API lấy danh sách file ảnh trong folder
async function getDriveFolderImageIds(rawInput) {
  const folderId = extractDriveId(rawInput);
  console.log('[Drive] folder ID extracted:', folderId);
  const url = 'https://www.googleapis.com/drive/v3/files'
    + `?q=%27${folderId}%27+in+parents+and+mimeType+contains+%27image%2F%27`
    + `&fields=files(id%2Cname)&orderBy=name&key=${DRIVE_API_KEY}`;
  const res  = await fetch(url);
  const data = await res.json();
  console.log('[Drive] API response:', data);
  if (data.error) throw new Error(data.error.message);
  const ids = (data.files || []).map(f => f.id);
  console.log('[Drive] image count:', ids.length);
  return ids;
}

// Nhận cả ID thuần và URL đầy đủ của Drive
function extractDriveId(input) {
  const m = input.match(/[-\w]{25,}/);
  return m ? m[0] : input;
}

function buildDriveFileUrl(input) {
  // Nếu là Drive URL bất kỳ → extract ID → build download URL
  if (input.includes('drive.google.com') || input.includes('docs.google.com')) {
    return `https://docs.google.com/uc?export=open&id=${extractDriveId(input)}`;
  }
  // URL khác (direct link) → dùng thẳng
  if (input.startsWith('http')) return input;
  // Chỉ là file ID
  return `https://drive.google.com/uc?export=download&id=${input}`;
}

// Parser CSV đơn giản (xử lý được dấu phẩy trong ngoặc kép)
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = splitCSVLine(lines[0]).map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = splitCSVLine(line);
    const obj  = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim().replace(/^"|"$/g,''); });
    return obj;
  });
}

function splitCSVLine(line) {
  const res = []; let cur = ''; let q = false;
  for (const ch of line + ',') {
    if (ch === '"') { q = !q; }
    else if (ch === ',' && !q) { res.push(cur); cur = ''; }
    else cur += ch;
  }
  return res;
}

// Bắt đầu load config ngay khi trang khởi động
loadConfig();

// ================================================================
//  INTRO HEART (3D)
// ================================================================
const heartBtnEl = document.getElementById("heartBtn");
let introScene, introCamera, introRenderer, introHeart, introAnimId;

function initIntroHeart() {
  introScene  = new THREE.Scene();
  introCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  introCamera.position.z = 40;

  introRenderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  introRenderer.setSize(200, 200);
  heartBtnEl.appendChild(introRenderer.domElement);

  const shape = new THREE.Shape();
  const sc    = 1.4;
  for (let i = 0; i <= 200; i++) {
    const t = i / 100 * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3) * sc;
    const y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * sc;
    i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y);
  }

  const geo = new THREE.ExtrudeGeometry(shape, {depth:4,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:0.5,bevelThickness:0.5});
  const mat = new THREE.MeshPhongMaterial({color:0xff8fdc, shininess:200, specular:0xffffff});
  introHeart = new THREE.Mesh(geo, mat);
  introScene.add(introHeart);
  introScene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5);
  dl.position.set(20, 20, 20);
  introScene.add(dl);

  (function loop() {
    introAnimId = requestAnimationFrame(loop);
    introHeart.rotation.y += 0.02;
    introRenderer.render(introScene, introCamera);
  })();
}

initIntroHeart();

// ================================================================
//  CLICK TO START
// ================================================================
const bgMusic = document.getElementById("bgMusic");

heartBtnEl.addEventListener("click", () => {
  bgMusic.play().then(() => { bgMusic.pause(); bgMusic.currentTime = 0; }).catch(()=>{});
  document.getElementById("loadingBar").style.opacity = "1";

  let w = 0;
  const fill = document.getElementById("loadingFill");
  const t = setInterval(() => {
    w += 3; fill.style.width = w + "%";
    if (w >= 100) { clearInterval(t); explodeFlash(); }
  }, 40);
});

function explodeFlash() {
  cancelAnimationFrame(introAnimId);
  introRenderer.dispose();

  const f = document.getElementById("flash");
  f.style.opacity = "1";
  setTimeout(() => {
    f.style.opacity = "0";
    const intro = document.getElementById("intro");
    intro.style.transition = "opacity 0.5s";
    intro.style.opacity    = "0";
    setTimeout(() => intro.style.display = "none", 500);

    document.fonts.ready.then(() => {
      document.getElementById("container").style.display = "block";
      // Chờ config xong rồi mới khởi tạo galaxy
      onConfigReady(cfg => {
        preloadImages(cfg.imageUrls, textures => initGalaxy(cfg, textures));
        bgMusic.play().catch(()=>{});
      });
    });
  }, 200);
}

// ================================================================
//  GALAXY
// ================================================================
let scene, camera, renderer, controls, orbitObjects = [];

function preloadImages(imageUrls, callback) {
  if (!imageUrls || imageUrls.length === 0) { callback([]); return; }

  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  const textures = new Array(imageUrls.length).fill(null);
  let done = 0;

  imageUrls.forEach((url, i) => {
    loader.load(url,
      tex  => { textures[i] = tex; if (++done === imageUrls.length) callback(textures.filter(Boolean)); },
      null,
      ()   => {            if (++done === imageUrls.length) callback(textures.filter(Boolean)); }
    );
  });
}

function initGalaxy(cfg, textures) {
  scene    = new THREE.Scene();
  camera   = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(15, 15, 40);

  renderer = new THREE.WebGLRenderer({antialias:false, alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  document.getElementById("container").appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan     = false;
  controls.enableZoom    = true;
  controls.zoomSpeed     = 1.5;

  addStars();

  // Số lượng image orbit objects tỉ lệ với số ảnh có sẵn (tối thiểu 1 vòng lặp, tối đa 40)
  const imgCount = textures.length > 0 ? Math.min(textures.length * 3, 40) : 0;
  for (let i = 0; i < imgCount; i++)  addOrbitObject("image", cfg, textures);
  for (let i = 0; i < 200; i++)       addOrbitObject("text",  cfg, textures);

  (function loop() {
    requestAnimationFrame(loop);
    tickOrbitObjects(cfg, textures);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function addStars() {
  const pos = [], col = [];
  for (let i = 0; i < 5000; i++) {
    pos.push(THREE.MathUtils.randFloatSpread(400), THREE.MathUtils.randFloatSpread(400), THREE.MathUtils.randFloatSpread(400));
    const c = new THREE.Color(0xffffff);
    c.offsetHSL(0, 0, Math.random() * 0.5);
    col.push(c.r, c.g, c.b);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({size:0.2, vertexColors:true})));
}

function addOrbitObject(type, cfg, textures) {
  let mesh;

  if (type === "image" && textures.length > 0) {
    const tex = textures[(Math.random() * textures.length) | 0];
    mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2.6, 2.6),
      new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide})
    );
  } else {
    const txt    = cfg.texts[(Math.random() * cfg.texts.length) | 0];
    const canvas = document.createElement("canvas");
    canvas.width = 1024; canvas.height = 128;
    const ctx    = canvas.getContext("2d", {alpha:true});
    ctx.clearRect(0, 0, 1024, 128);
    ctx.font          = "700 40px Poppins, sans-serif";
    ctx.textAlign     = "center";
    ctx.textBaseline  = "middle";
    ctx.fillStyle     = "#fbaea1";
    ctx.shadowColor   = "#fbaea1";
    ctx.shadowBlur    = 15;
    ctx.fillText(txt, 512, 64);

    mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 3),
      new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(canvas), transparent:true, depthWrite:false, side:THREE.DoubleSide})
    );
  }

  const R = 12 + Math.random() * 8;
  orbitObjects.push({
    mesh, type,
    R, theta: Math.random() * Math.PI * 2,
    y: (Math.random() * 2 - 1) * R,
    life: Math.random(),
    spiral: Math.random() * Math.PI * 2,
    speed:  0.004 + Math.random() * 0.006
  });
  scene.add(mesh);
}

function tickOrbitObjects(cfg, textures) {
  for (let i = orbitObjects.length - 1; i >= 0; i--) {
    const o = orbitObjects[i];
    o.life   += 0.001 + Math.random() * 0.0015;
    o.theta  += o.speed;
    o.spiral += 0.004;

    if (o.type === "text" && o.life > 2) {
      o.mesh.material.opacity -= 0.003;
      if (o.mesh.material.opacity <= 0) {
        scene.remove(o.mesh);
        orbitObjects.splice(i, 1);
        addOrbitObject("text", cfg, textures);
        continue;
      }
    }
    if (o.type === "image" && o.life > 3) o.life = 0;

    const ring = Math.sqrt(Math.max(0, o.R * o.R - o.y * o.y));
    const wave = Math.sin(o.spiral) * 0.6;
    o.mesh.position.set(
      (ring + wave * Math.sin(o.theta)) * Math.cos(o.theta),
      o.y * 0.5 + Math.sin(o.theta * 2) * 0.3,
      (ring + wave * Math.cos(o.theta)) * Math.sin(o.theta)
    );
    o.mesh.lookAt(new THREE.Vector3(0, 0, 0));
  }
}

window.addEventListener("resize", () => {
  if (!camera) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

<script>
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if (e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["i","j","c","s"].includes(e.key.toLowerCase())) ||
        (e.ctrlKey && e.key.toLowerCase() === "u")) {
      e.preventDefault(); return false;
    }
  });
  document.addEventListener("selectstart", e => e.preventDefault());

</script>
</body>
